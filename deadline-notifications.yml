name: Schoolly deadline notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tasks.json'
      - 'scripts/check_deadlines.py'
      - '.github/workflows/deadline-notifications.yml'
permissions:
  contents: write
concurrency:
  group: schoolly-deadline-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check deadlines and send push notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCHOOLLY_TZ: Europe/Berlin
        run: python3 scripts/check_deadlines.py
      - name: Save sent-reminder history
        run: |
          if ! git diff --quiet -- notified.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add notified.json
            git commit -m 'Update sent reminder history [skip ci]'
            git push
          fi
